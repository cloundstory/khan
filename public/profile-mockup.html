<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Khan — Profile Mockup</title>
    <style>
      :root {
        --paper: #f4efe4;
        --paper-hi: #fbf8f0;
        --paper-low: #e7ddcc;
        --ink: #2d2b28;
        --muted: #777269;
        --sage: #536d5c;
        --sage-pale: #dce4d8;
        --terracotta: #b86645;
        --line: rgba(45, 43, 40, .18);
        --shadow: rgba(68, 54, 40, .12);
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; background: #ded4c4; }
      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 17% 8%, rgba(255,255,255,.72), transparent 32%),
          repeating-linear-gradient(0deg, rgba(101,81,61,.025) 0 1px, transparent 1px 4px),
          var(--paper);
        font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
        letter-spacing: .01em;
      }

      button { font: inherit; color: inherit; }
      .mockup {
        width: min(100%, 520px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
        overflow: hidden;
      }

      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .topbar button {
        width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%;
        background: rgba(251,248,240,.72); font-size: 20px; line-height: 1; cursor: pointer;
      }
      .topbar h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 600; }
      .topbar .quiet { font-size: 12px; border: 0; background: transparent; color: var(--muted); }

      .identity {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 150px;
        gap: 12px;
        align-items: stretch;
        min-height: 214px;
        padding: 18px 17px 15px;
        border: 1px solid var(--line);
        border-radius: 20px 16px 21px 14px;
        background: rgba(251,248,240,.76);
        box-shadow: 0 8px 24px var(--shadow);
        overflow: hidden;
      }
      .identity::after {
        content: "";
        position: absolute;
        right: 5px; bottom: -42px;
        width: 180px; height: 160px;
        border: 1px dashed rgba(83,109,92,.28);
        border-radius: 50%;
        transform: rotate(-12deg);
      }
      .identity-copy { position: relative; z-index: 1; padding-bottom: 2px; }
      .identity h2 { margin: 2px 0 13px; font-family: Georgia, "Times New Roman", serif; font-size: 26px; font-weight: 600; }
      .note-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; }
      .note-field {
        width: 100%; min-height: 82px; padding: 9px 10px 7px;
        border: 1px dashed rgba(45,43,40,.28); border-radius: 9px 7px 10px 6px;
        background: rgba(255,255,255,.25);
      }
      .note-field textarea {
        display: block; width: 100%; min-height: 37px; resize: none; padding: 0;
        border: 0; outline: 0; background: transparent; color: var(--ink);
        font: 13px/1.55 Georgia, "Times New Roman", serif;
      }
      .note-field textarea::placeholder { color: #918a80; opacity: 1; }
      .edit-button {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 13px; padding: 7px 11px;
        border: 1px solid rgba(83,109,92,.35); border-radius: 999px; background: var(--sage-pale);
        color: #314d3d; font-size: 12px; cursor: pointer;
      }
      .thought-portrait { position: relative; z-index: 1; align-self: end; justify-self: end; width: 150px; height: 176px; overflow: hidden; border-radius: 52% 48% 45% 55%; background: rgba(220,228,216,.66); transform: rotate(3deg); }
      .thought-portrait::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(83,109,92,.22); border-radius: 50%; pointer-events: none; }
      .thought-portrait img { position: absolute; left: -7px; top: -4px; width: 164px; height: 246px; object-fit: cover; object-position: 50% 12%; transform: scale(2.55); transform-origin: center top; }

      .section { margin-top: 22px; }
      .section-heading { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 9px; }
      .section-heading h3 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; }
      .section-heading span { color: var(--muted); font-size: 11px; }

      .current-book {
        display: grid; grid-template-columns: 45px 1fr auto; gap: 11px; align-items: center;
        width: 100%; padding: 12px 13px; border: 1px solid var(--line);
        border-radius: 13px 10px 14px 9px; background: rgba(251,248,240,.62); text-align: left;
      }
      .book-swatch { width: 43px; height: 57px; border-radius: 3px 6px 4px 2px; background: linear-gradient(135deg,#a65c3d 0 35%,#d89b69 35% 39%,#4f6657 39% 100%); box-shadow: 2px 3px 0 #d2c5b3; transform: rotate(-3deg); }
      .book-meta strong { display: block; margin-bottom: 4px; font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 600; }
      .book-meta small { color: var(--muted); font-size: 11px; }
      .book-progress { width: 58px; height: 4px; overflow: hidden; border-radius: 8px; background: #ddd4c5; }
      .book-progress i { display: block; width: 62%; height: 100%; background: var(--terracotta); }

      .streak-card { padding: 14px 14px 13px; border: 1px solid var(--line); border-radius: 15px 10px 13px 12px; background: rgba(251,248,240,.62); }
      .streak-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .streak-top strong { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; }
      .streak-top span { color: var(--sage); font-size: 12px; }
      .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 4px; }
      .calendar span { display: grid; place-items: center; height: 25px; color: #928a80; font-size: 10px; }
      .calendar .day { height: 29px; border: 1px solid transparent; border-radius: 9px 6px 8px 5px; color: var(--ink); font-size: 11px; }
      .calendar .read { border-color: rgba(83,109,92,.24); background: var(--sage-pale); color: #314d3d; }
      .calendar .today { border-color: var(--terracotta); box-shadow: inset 0 -2px 0 var(--terracotta); }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat { padding: 12px 9px 11px; border: 1px dashed rgba(45,43,40,.24); border-radius: 11px 8px 12px 8px; background: rgba(251,248,240,.46); text-align: center; }
      .stat strong { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 600; }
      .stat span { color: var(--muted); font-size: 10px; }

      .link-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .link-row button { min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 11px 8px 12px 8px; background: rgba(251,248,240,.54); font-size: 12px; cursor: pointer; }
      .link-row button:first-child { border-color: rgba(83,109,92,.36); color: #314d3d; }

      @media (prefers-reduced-motion: no-preference) {
        .thought-portrait img { animation: breathe 6s ease-in-out infinite; transform-origin: center top; }
        @keyframes breathe { 0%,100% { transform: scale(2.55); } 50% { transform: scale(2.58,2.62); } }
      }
    </style>
  </head>
  <body>
    <main class="mockup" aria-label="Profile mockup">
      <header class="topbar">
        <button aria-label="Back">‹</button>
        <h1>Profile</h1>
        <button class="quiet" aria-label="Settings">Settings</button>
      </header>

      <section class="identity" aria-label="Reader profile">
        <div class="identity-copy">
          <h2>Reader 01</h2>
          <label class="note-label" for="profile-note">About me</label>
          <div class="note-field">
            <textarea id="profile-note" placeholder="Write something about yourself..." aria-label="About me"></textarea>
          </div>
          <button class="edit-button">✦ Edit appearance</button>
        </div>
        <div class="thought-portrait" aria-label="Reader thought portrait">
          <img src="/scene/characters/reader-01--window-01.png" alt="Reader looking upward" />
        </div>
      </section>

      <section class="section" aria-label="Currently reading">
        <div class="section-heading"><h3>Currently reading</h3><span>View details →</span></div>
        <div class="current-book">
          <div class="book-swatch" aria-hidden="true"></div>
          <div class="book-meta"><strong>The book I’m reading</strong><small>62% complete · On desk</small></div>
          <div class="book-progress" aria-hidden="true"><i></i></div>
        </div>
      </section>

      <section class="section" aria-label="Reading rhythm">
        <div class="section-heading"><h3>Reading rhythm</h3><span>July 2026</span></div>
        <div class="streak-card">
          <div class="streak-top"><strong>12 day streak</strong></div>
          <div class="calendar" aria-label="Reading calendar">
            <span>M</span><span>T</span><span>W</span><span>Th</span><span>F</span><span>S</span><span>Su</span>
            <span></span><span></span><span>1</span><span class="day read">2</span><span class="day read">3</span><span class="day read">4</span><span class="day read">5</span>
            <span class="day read">6</span><span class="day read">7</span><span class="day read">8</span><span class="day read">9</span><span class="day read">10</span><span class="day read">11</span><span class="day read">12</span>
            <span class="day read">13</span><span class="day read">14</span><span class="day read">15</span><span class="day read">16</span><span class="day today">17</span><span>18</span><span>19</span>
          </div>
        </div>
      </section>

      <section class="section" aria-label="Reading record">
        <div class="section-heading"><h3>Reading record</h3><span>All time</span></div>
        <div class="stats">
          <div class="stat"><strong>08</strong><span>Finished</span></div>
          <div class="stat"><strong>24</strong><span>Sessions</span></div>
          <div class="stat"><strong>18h</strong><span>Reading time</span></div>
        </div>
      </section>

      <section class="section link-row" aria-label="Shortcuts">
        <button>My library →</button>
        <button>Evidence board →</button>
      </section>

    </main>
  </body>
</html>
